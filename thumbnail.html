<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200" />
    <title>Portfolio thumbnail</title>
    <style>
      html, body { margin: 0; background: #fff; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
      .card { position: relative; width: 1200px; height: 627px; overflow: hidden; background: #fff; color: #222; display: grid; place-items: center; text-align: center; box-sizing: border-box; padding: 0 80px; }
      .ghost { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 330px; font-weight: 600; letter-spacing: -0.05em; color: #f2f2f2; line-height: 1; white-space: nowrap; user-select: none; z-index: 0; }
      .inner { position: relative; z-index: 1; display: grid; justify-items: center; gap: 30px; }
      .kicker { display: inline-flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 500; color: #7a7a7a; }
      .kicker i { width: 9px; height: 9px; border-radius: 50%; background: #222; display: inline-block; }
      h1 { margin: 0; font-size: 96px; font-weight: 500; letter-spacing: -0.045em; line-height: 0.98; }
      h1 b { font-weight: 700; }
      .url { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; padding: 18px 34px; border-radius: 999px; background: #222; color: #fff; margin-top: 6px; }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="ghost">ENGINEER</span>
      <div class="inner">
        <span class="kicker"><i></i> My portfolio is live</span>
        <h1><b>Value</b> is what matters in life.</h1>
        <span class="url">jsebastianv.com</span>
      </div>
    </div>
  </body>
</html>
